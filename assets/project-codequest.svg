<svg xmlns="http://www.w3.org/2000/svg" width="430" height="250" viewBox="0 0 430 250" role="img" aria-label="CodeQuest — Interactive coding puzzle game"><title>CodeQuest — Interactive coding puzzle game</title>
<defs>
  <linearGradient id="bgcodequest" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#1b0712"/><stop offset=".55" stop-color="#0c0408"/><stop offset="1" stop-color="#2b0a1d"/>
  </linearGradient>
  <radialGradient id="halocodequest" cx=".82" cy=".25" r=".7">
    <stop offset="0" stop-color="#ff3d8b" stop-opacity=".30"/><stop offset=".45" stop-color="#c2185b" stop-opacity=".10"/><stop offset="1" stop-color="#0c0408" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="edgecodequest" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#ff3d8b" stop-opacity="0"/><stop offset=".5" stop-color="#ff3d8b" stop-opacity=".9"/><stop offset="1" stop-color="#ff3d8b" stop-opacity="0"/>
  </linearGradient>
  <pattern id="gridcodequest" width="22" height="22" patternUnits="userSpaceOnUse">
    <path d="M22 0H0V22" fill="none" stroke="#ff3d8b" stroke-opacity=".05"/>
  </pattern>
</defs>
<style>
  .serif { font-family: Georgia, 'Times New Roman', 'DejaVu Serif', serif; }
  .mono  { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace; }
  .lbl   { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace; font-size: 10.5px; letter-spacing: 2.2px; fill: #c49aae; }
  .num   { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace; font-size: 10.5px; letter-spacing: 2px; fill: #ff3d8b; font-weight: 700; }
  @keyframes blink { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }
  @keyframes pulse { 0%,100% { opacity: .35 } 50% { opacity: 1 } }
  @keyframes glow  { 0%,100% { opacity: .55 } 50% { opacity: .9 } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: translateY(0) } }
  .cursor { animation: blink 1.1s step-end infinite; }
  .pulse  { animation: pulse 2.4s ease-in-out infinite; }
  .glow   { animation: glow 5s ease-in-out infinite; }
  .rise   { animation: fadeUp .9s ease-out both; }
</style>
<rect x="0.5" y="0.5" width="429" height="249" rx="16" fill="url(#bgcodequest)"/>
<rect x="0.5" y="0.5" width="429" height="249" rx="16" fill="url(#gridcodequest)"/>
<rect class="glow" x="0.5" y="0.5" width="429" height="249" rx="16" fill="url(#halocodequest)"/>
<rect x="0.5" y="0.5" width="429" height="249" rx="16" fill="none" stroke="#5a1f3a"/>
<rect x="64.5" y="0" width="301.0" height="1.2" fill="url(#edgecodequest)"/>
<path d="M8 18V8H18" stroke="#ff7ab0" stroke-opacity=".7" fill="none"/><path d="M412 8H422V18" stroke="#ff7ab0" stroke-opacity=".7" fill="none"/><path d="M8 232V242H18" stroke="#ff7ab0" stroke-opacity=".7" fill="none"/><path d="M412 242H422V232" stroke="#ff7ab0" stroke-opacity=".7" fill="none"/><text x="26" y="38"><tspan class="num">05</tspan><tspan class="lbl" dx="10">MOBILE · GAME</tspan></text><text x="24" y="84" text-anchor="start" class="serif" font-size="32" fill="#f7e8ef">CodeQuest</text><text x="26" y="106" class="mono" font-size="9.5" letter-spacing="1.2" font-weight="700" fill="#ff7ab0">INTERACTIVE CODING PUZZLE GAME</text><text x="26" y="136" class="serif" font-size="14" fill="#c49aae">Mobile game with coding challenges</text><text x="26" y="155" class="serif" font-size="14" fill="#c49aae">and interactive gameplay.</text><rect x="26" y="200" width="64" height="20" rx="4" fill="#ff3d8b" fill-opacity="1" stroke="#ff3d8b" stroke-opacity=".55"/><text x="58" y="213.5" text-anchor="middle" class="mono" font-size="10" font-weight="700" letter-spacing="1" fill="#0c0408">FLUTTER</text><rect x="96.19999999999999" y="200" width="44" height="20" rx="4" fill="none" fill-opacity="0" stroke="#ff3d8b" stroke-opacity=".55"/><text x="118" y="213.5" text-anchor="middle" class="mono" font-size="10" font-weight="700" letter-spacing="1" fill="#ff7ab0">DART</text><rect x="146.6" y="200" width="71" height="20" rx="4" fill="none" fill-opacity="0" stroke="#ff3d8b" stroke-opacity=".55"/><text x="182" y="213.5" text-anchor="middle" class="mono" font-size="10" font-weight="700" letter-spacing="1" fill="#ff7ab0">FIREBASE</text><text x="290" y="90" class="mono" font-size="54" fill="#ff3d8b" fill-opacity=".85">{ }</text><circle cx="298" cy="120" r="7" fill="#ff3d8b" stroke="#ff7ab0" /><line x1="305" y1="120" x2="317" y2="120" stroke="#5a1f3a"/><circle cx="324" cy="120" r="7" fill="#ff3d8b" stroke="#ff7ab0" /><line x1="331" y1="120" x2="343" y2="120" stroke="#5a1f3a"/><circle cx="350" cy="120" r="7" fill="#ff3d8b" stroke="#ff7ab0" /><line x1="357" y1="120" x2="369" y2="120" stroke="#5a1f3a"/><circle cx="376" cy="120" r="7" fill="none" stroke="#ff7ab0" class="pulse"/><line x1="383" y1="120" x2="395" y2="120" stroke="#5a1f3a"/><circle cx="402" cy="120" r="7" fill="none" stroke="#ff7ab0" /><text x="290" y="146" class="mono" font-size="8.5" letter-spacing="1.2" fill="#7d5167">LEVEL 04 / 05</text></svg>
