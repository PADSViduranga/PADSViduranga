<svg xmlns="http://www.w3.org/2000/svg" width="880" height="236" viewBox="0 0 880 236" role="img" aria-label="ApexHire — Full-stack recruitment platform"><title>ApexHire — Full-stack recruitment platform</title>
<defs>
  <linearGradient id="bgapexhire" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#1b0712"/><stop offset=".55" stop-color="#0c0408"/><stop offset="1" stop-color="#2b0a1d"/>
  </linearGradient>
  <radialGradient id="haloapexhire" cx=".82" cy=".25" r=".7">
    <stop offset="0" stop-color="#ff3d8b" stop-opacity=".30"/><stop offset=".45" stop-color="#c2185b" stop-opacity=".10"/><stop offset="1" stop-color="#0c0408" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="edgeapexhire" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#ff3d8b" stop-opacity="0"/><stop offset=".5" stop-color="#ff3d8b" stop-opacity=".9"/><stop offset="1" stop-color="#ff3d8b" stop-opacity="0"/>
  </linearGradient>
  <pattern id="gridapexhire" width="22" height="22" patternUnits="userSpaceOnUse">
    <path d="M22 0H0V22" fill="none" stroke="#ff3d8b" stroke-opacity=".05"/>
  </pattern>
</defs>
<style>
  .serif { font-family: Georgia, 'Times New Roman', 'DejaVu Serif', serif; }
  .mono  { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace; }
  .lbl   { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace; font-size: 10.5px; letter-spacing: 2.2px; fill: #c49aae; }
  .num   { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace; font-size: 10.5px; letter-spacing: 2px; fill: #ff3d8b; font-weight: 700; }
  @keyframes blink { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }
  @keyframes pulse { 0%,100% { opacity: .35 } 50% { opacity: 1 } }
  @keyframes glow  { 0%,100% { opacity: .55 } 50% { opacity: .9 } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: translateY(0) } }
  .cursor { animation: blink 1.1s step-end infinite; }
  .pulse  { animation: pulse 2.4s ease-in-out infinite; }
  .glow   { animation: glow 5s ease-in-out infinite; }
  .rise   { animation: fadeUp .9s ease-out both; }
</style>
<rect x="0.5" y="0.5" width="879" height="235" rx="16" fill="url(#bgapexhire)"/>
<rect x="0.5" y="0.5" width="879" height="235" rx="16" fill="url(#gridapexhire)"/>
<rect class="glow" x="0.5" y="0.5" width="879" height="235" rx="16" fill="url(#haloapexhire)"/>
<rect x="0.5" y="0.5" width="879" height="235" rx="16" fill="none" stroke="#5a1f3a"/>
<rect x="132.0" y="0" width="616.0" height="1.2" fill="url(#edgeapexhire)"/>
<path d="M8 18V8H18" stroke="#ff7ab0" stroke-opacity=".7" fill="none"/><path d="M862 8H872V18" stroke="#ff7ab0" stroke-opacity=".7" fill="none"/><path d="M8 218V228H18" stroke="#ff7ab0" stroke-opacity=".7" fill="none"/><path d="M862 228H872V218" stroke="#ff7ab0" stroke-opacity=".7" fill="none"/><text x="32" y="40"><tspan class="num">01</tspan><tspan class="lbl" dx="10">FULL-STACK · RECRUITMENT</tspan></text><text x="30" y="92" text-anchor="start" class="serif" font-size="42" fill="#f7e8ef">ApexHire</text><text x="32" y="116" class="mono" font-size="11" letter-spacing="1.5" font-weight="700" fill="#ff7ab0">FULL-STACK RECRUITMENT PLATFORM</text><text x="32" y="146" class="serif" font-size="15" fill="#c49aae">A modern recruitment platform that takes a candidate from</text><text x="32" y="166" class="serif" font-size="15" fill="#c49aae">application to offer, built with React and ASP.NET Core.</text><text x="32" y="196" class="lbl" font-size="9"><tspan fill="#ff3d8b">BUILT</tspan> ·</text><rect x="92" y="183" width="51" height="20" rx="4" fill="#ff3d8b" fill-opacity="1" stroke="#ff3d8b" stroke-opacity=".55"/><text x="118" y="196.5" text-anchor="middle" class="mono" font-size="10" font-weight="700" letter-spacing="1" fill="#0c0408">REACT</text><rect x="151.0" y="183" width="44" height="20" rx="4" fill="none" fill-opacity="0" stroke="#ff3d8b" stroke-opacity=".55"/><text x="173" y="196.5" text-anchor="middle" class="mono" font-size="10" font-weight="700" letter-spacing="1" fill="#ff7ab0">.NET</text><rect x="203.4" y="183" width="84" height="20" rx="4" fill="none" fill-opacity="0" stroke="#ff3d8b" stroke-opacity=".55"/><text x="245" y="196.5" text-anchor="middle" class="mono" font-size="10" font-weight="700" letter-spacing="1" fill="#ff7ab0">SQL SERVER</text><line x1="582" y1="30" x2="582" y2="206" stroke="#5a1f3a"/><path id="pp" d="M614 118 C674 118,674 78,724 78 S784 148,844 108" fill="none" stroke="#ff3d8b" stroke-opacity=".5" stroke-dasharray="3 4"/><circle cx="614" cy="118" r="6" fill="#0c0408" stroke="#ff7ab0"/><text x="614" y="144" text-anchor="middle" class="mono" font-size="8.5" letter-spacing="1.2" fill="#c49aae">APPLIED</text><circle cx="689" cy="88" r="6" fill="#0c0408" stroke="#ff7ab0"/><text x="689" y="72" text-anchor="middle" class="mono" font-size="8.5" letter-spacing="1.2" fill="#c49aae">SCREEN</text><circle cx="774" cy="120" r="6" fill="#0c0408" stroke="#ff7ab0"/><text x="774" y="146" text-anchor="middle" class="mono" font-size="8.5" letter-spacing="1.2" fill="#c49aae">INTERVIEW</text><circle cx="844" cy="108" r="9" fill="#0c0408" stroke="#ff7ab0"/><text x="844" y="92" text-anchor="middle" class="mono" font-size="8.5" letter-spacing="1.2" fill="#c49aae">OFFER</text><circle cx="844" cy="108" r="3.5" fill="#ff3d8b" class="pulse"/><circle r="4" fill="#ff3d8b"><animateMotion dur="4s" repeatCount="indefinite"><mpath href="#pp"/></animateMotion></circle></svg>
