<svg xmlns="http://www.w3.org/2000/svg" width="880" height="370" viewBox="0 0 880 370" role="img" aria-label="Sachintha Viduranga — CS undergraduate and full-stack developer"><title>Sachintha Viduranga — CS undergraduate and full-stack developer</title>
<defs>
  <linearGradient id="bgh" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#1b0712"/><stop offset=".55" stop-color="#0c0408"/><stop offset="1" stop-color="#2b0a1d"/>
  </linearGradient>
  <radialGradient id="haloh" cx=".82" cy=".25" r=".7">
    <stop offset="0" stop-color="#ff3d8b" stop-opacity=".30"/><stop offset=".45" stop-color="#c2185b" stop-opacity=".10"/><stop offset="1" stop-color="#0c0408" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="edgeh" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#ff3d8b" stop-opacity="0"/><stop offset=".5" stop-color="#ff3d8b" stop-opacity=".9"/><stop offset="1" stop-color="#ff3d8b" stop-opacity="0"/>
  </linearGradient>
  <pattern id="gridh" width="22" height="22" patternUnits="userSpaceOnUse">
    <path d="M22 0H0V22" fill="none" stroke="#ff3d8b" stroke-opacity=".05"/>
  </pattern>
</defs>
<style>
  .serif { font-family: Georgia, 'Times New Roman', 'DejaVu Serif', serif; }
  .mono  { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace; }
  .lbl   { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace; font-size: 10.5px; letter-spacing: 2.2px; fill: #c49aae; }
  .num   { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace; font-size: 10.5px; letter-spacing: 2px; fill: #ff3d8b; font-weight: 700; }
  @keyframes blink { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }
  @keyframes pulse { 0%,100% { opacity: .35 } 50% { opacity: 1 } }
  @keyframes glow  { 0%,100% { opacity: .55 } 50% { opacity: .9 } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: translateY(0) } }
  .cursor { animation: blink 1.1s step-end infinite; }
  .pulse  { animation: pulse 2.4s ease-in-out infinite; }
  .glow   { animation: glow 5s ease-in-out infinite; }
  .rise   { animation: fadeUp .9s ease-out both; }

  @keyframes spin  { to { transform: rotate(360deg) } }
  @keyframes spinr { to { transform: rotate(-360deg) } }
  .spin  { transform-origin: 715px 190px; animation: spin 40s linear infinite; }
  .spinr { transform-origin: 715px 190px; animation: spinr 26s linear infinite; }
</style>
<rect x="0.5" y="0.5" width="879" height="369" rx="16" fill="url(#bgh)"/>
<rect x="0.5" y="0.5" width="879" height="369" rx="16" fill="url(#gridh)"/>
<rect class="glow" x="0.5" y="0.5" width="879" height="369" rx="16" fill="url(#haloh)"/>
<rect x="0.5" y="0.5" width="879" height="369" rx="16" fill="none" stroke="#5a1f3a"/>
<rect x="132.0" y="0" width="616.0" height="1.2" fill="url(#edgeh)"/>
<path d="M8 18V8H18" stroke="#ff7ab0" stroke-opacity=".7" fill="none"/><path d="M862 8H872V18" stroke="#ff7ab0" stroke-opacity=".7" fill="none"/><path d="M8 352V362H18" stroke="#ff7ab0" stroke-opacity=".7" fill="none"/><path d="M862 362H872V352" stroke="#ff7ab0" stroke-opacity=".7" fill="none"/>
<defs>
  <radialGradient id="orb" cx=".35" cy=".3" r=".8">
    <stop offset="0" stop-color="#ff7ab0"/><stop offset=".55" stop-color="#c2185b"/><stop offset="1" stop-color="#3a0a22"/>
  </radialGradient>
</defs>
<!-- prompt pill -->
<g class="rise">
  <rect x="36" y="30" width="292" height="26" rx="13" fill="#0c0408" stroke="#5a1f3a"/>
  <circle cx="52" cy="43" r="3.5" fill="#ff3d8b" class="pulse"/>
  <text x="64" y="47" class="mono" font-size="11" fill="#c49aae">~/sachintha <tspan fill="#ff3d8b">›</tspan> build --scalable <tspan class="cursor" fill="#ff3d8b">▍</tspan></text>
</g>
<text x="36" y="96" class="lbl rise">— 01 · SOFTWARE ENGINEERING · FULL-STACK · CLOUD</text>
<g class="rise" style="animation-delay:.15s">
  <text x="34" y="168" text-anchor="start" class="serif" font-size="66" fill="#f7e8ef">Sachintha</text>
  <text x="34" y="238" text-anchor="start" class="serif" font-size="66" fill="#f7e8ef">Viduranga<tspan fill="#ff3d8b">.</tspan></text>
</g>
<text x="36" y="274" class="mono rise" font-size="11.5" letter-spacing="2" font-weight="700" fill="#ff7ab0" style="animation-delay:.3s">CS UNDERGRADUATE · FULL-STACK DEVELOPER · BACKEND</text>
<text x="36" y="302" class="serif rise" font-size="17" font-style="italic" fill="#f7e8ef" style="animation-delay:.4s">Building ideas into real-world solutions.</text>
<line x1="36" y1="322" x2="520" y2="322" stroke="#5a1f3a"/>
<text x="36" y="342" class="lbl" font-size="9.5">BSc (HONS) CS · NSBM GREEN UNIVERSITY · 2025 — PRESENT · SRI LANKA</text>

<!-- monogram orb -->
<g>
  <circle cx="715" cy="190" r="128" fill="#ff3d8b" fill-opacity=".05" class="pulse"/>
  <circle class="spin"  cx="715" cy="190" r="112" fill="none" stroke="#ff3d8b" stroke-opacity=".45" stroke-dasharray="2 7"/>
  <g class="spinr">
    <circle cx="715" cy="190" r="94" fill="none" stroke="#ff7ab0" stroke-opacity=".35" stroke-dasharray="60 18 4 18"/>
    <circle cx="809" cy="190" r="4" fill="#ff3d8b"/>
  </g>
  <circle cx="715" cy="190" r="74" fill="url(#orb)"/>
  <circle cx="715" cy="190" r="74" fill="none" stroke="#ff7ab0" stroke-opacity=".8"/>
  <text x="715" y="209" text-anchor="middle" class="serif" font-size="56" font-style="italic" fill="#f7e8ef">SV</text>
  <path d="M565 72h34M565 72v10" stroke="#c49aae" stroke-opacity=".6" fill="none"/>
  <text x="567" y="66" class="mono" font-size="9" letter-spacing="1.5" fill="#7d5167">FIG. 01</text>
  <text x="801" y="318" class="mono" font-size="9" letter-spacing="1.5" fill="#7d5167">LK · 6.9°N</text>
  <path d="M795 308h34" stroke="#c49aae" stroke-opacity=".6"/>
</g></svg>
