<svg xmlns="http://www.w3.org/2000/svg" width="430" height="250" viewBox="0 0 430 250" role="img" aria-label="PixelProof AI — AI-powered image analysis"><title>PixelProof AI — AI-powered image analysis</title>
<defs>
  <linearGradient id="bgpixelproof" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#1b0712"/><stop offset=".55" stop-color="#0c0408"/><stop offset="1" stop-color="#2b0a1d"/>
  </linearGradient>
  <radialGradient id="halopixelproof" cx=".82" cy=".25" r=".7">
    <stop offset="0" stop-color="#ff3d8b" stop-opacity=".30"/><stop offset=".45" stop-color="#c2185b" stop-opacity=".10"/><stop offset="1" stop-color="#0c0408" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="edgepixelproof" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#ff3d8b" stop-opacity="0"/><stop offset=".5" stop-color="#ff3d8b" stop-opacity=".9"/><stop offset="1" stop-color="#ff3d8b" stop-opacity="0"/>
  </linearGradient>
  <pattern id="gridpixelproof" width="22" height="22" patternUnits="userSpaceOnUse">
    <path d="M22 0H0V22" fill="none" stroke="#ff3d8b" stroke-opacity=".05"/>
  </pattern>
</defs>
<style>
  .serif { font-family: Georgia, 'Times New Roman', 'DejaVu Serif', serif; }
  .mono  { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace; }
  .lbl   { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace; font-size: 10.5px; letter-spacing: 2.2px; fill: #c49aae; }
  .num   { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace; font-size: 10.5px; letter-spacing: 2px; fill: #ff3d8b; font-weight: 700; }
  @keyframes blink { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }
  @keyframes pulse { 0%,100% { opacity: .35 } 50% { opacity: 1 } }
  @keyframes glow  { 0%,100% { opacity: .55 } 50% { opacity: .9 } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: translateY(0) } }
  .cursor { animation: blink 1.1s step-end infinite; }
  .pulse  { animation: pulse 2.4s ease-in-out infinite; }
  .glow   { animation: glow 5s ease-in-out infinite; }
  .rise   { animation: fadeUp .9s ease-out both; }
</style>
