<svg xmlns="http://www.w3.org/2000/svg" width="880" height="104" viewBox="0 0 880 104" role="img" aria-label="TOOLKIT: The tools I reach for."><title>TOOLKIT: The tools I reach for.</title>
<style>
  .serif { font-family: Georgia, 'Times New Roman', 'DejaVu Serif', serif; }
  .mono  { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace; }
  .lbl   { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace; font-size: 10.5px; letter-spacing: 2.2px; fill: #c49aae; }
  .num   { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace; font-size: 10.5px; letter-spacing: 2px; fill: #ff3d8b; font-weight: 700; }
  @keyframes blink { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }
  @keyframes pulse { 0%,100% { opacity: .35 } 50% { opacity: 1 } }
  @keyframes glow  { 0%,100% { opacity: .55 } 50% { opacity: .9 } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: translateY(0) } }
  .cursor { animation: blink 1.1s step-end infinite; }
  .pulse  { animation: pulse 2.4s ease-in-out infinite; }
  .glow   { animation: glow 5s ease-in-out infinite; }
  .rise   { animation: fadeUp .9s ease-out both; }
</style>
<defs><linearGradient id="ln" x1="0" x2="1"><stop offset="0" stop-color="#ff3d8b"/><stop offset=".35" stop-color="#ff3d8b" stop-opacity=".35"/><stop offset="1" stop-color="#ff3d8b" stop-opacity="0"/></linearGradient></defs>
<text x="4" y="30"><tspan class="num">03</tspan><tspan class="lbl" dx="10">TOOLKIT</tspan></text>
<text x="876" y="30" text-anchor="end" class="lbl" font-size="9.5" fill="#7d5167">LANGUAGES · FRAMEWORKS · CLOUD</text>
<text x="2" y="74" text-anchor="start" class="serif" font-size="36" fill="#f7e8ef">The tools I <tspan font-style="italic" fill="#ff7ab0">reach for.</tspan></text>
<rect x="2" y="90" width="876" height="1.4" fill="url(#ln)"/>
<circle cy="90.7" r="3" fill="#ff7ab0"><animate attributeName="cx" values="4;600;4" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;.2;1" dur="9s" repeatCount="indefinite"/></circle></svg>
