<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" role="img" aria-label="Commit log syncing"><title>Commit log syncing</title>
<defs>
  <linearGradient id="bgc" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#1b0712"/><stop offset=".55" stop-color="#0c0408"/><stop offset="1" stop-color="#2b0a1d"/>
  </linearGradient>
  <radialGradient id="haloc" cx=".82" cy=".25" r=".7">
    <stop offset="0" stop-color="#ff3d8b" stop-opacity=".30"/><stop offset=".45" stop-color="#c2185b" stop-opacity=".10"/><stop offset="1" stop-color="#0c0408" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="edgec" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#ff3d8b" stop-opacity="0"/><stop offset=".5" stop-color="#ff3d8b" stop-opacity=".9"/><stop offset="1" stop-color="#ff3d8b" stop-opacity="0"/>
  </linearGradient>
  <pattern id="gridc" width="22" height="22" patternUnits="userSpaceOnUse">
    <path d="M22 0H0V22" fill="none" stroke="#ff3d8b" stroke-opacity=".05"/>
  </pattern>
</defs>
<style>
  .serif { font-family: Georgia, 'Times New Roman', 'DejaVu Serif', serif; }
  .mono  { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace; }
  .lbl   { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace; font-size: 10.5px; letter-spacing: 2.2px; fill: #c49aae; }
  .num   { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace; font-size: 10.5px; letter-spacing: 2px; fill: #ff3d8b; font-weight: 700; }
  @keyframes blink { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }
  @keyframes pulse { 0%,100% { opacity: .35 } 50% { opacity: 1 } }
  @keyframes glow  { 0%,100% { opacity: .55 } 50% { opacity: .9 } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: translateY(0) } }
  .cursor { animation: blink 1.1s step-end infinite; }
  .pulse  { animation: pulse 2.4s ease-in-out infinite; }
  .glow   { animation: glow 5s ease-in-out infinite; }
  .rise   { animation: fadeUp .9s ease-out both; }
</style>
<rect x="0.5" y="0.5" width="879" height="299" rx="16" fill="url(#bgc)"/>
<rect x="0.5" y="0.5" width="879" height="299" rx="16" fill="url(#gridc)"/>
<rect class="glow" x="0.5" y="0.5" width="879" height="299" rx="16" fill="url(#haloc)"/>
<rect x="0.5" y="0.5" width="879" height="299" rx="16" fill="none" stroke="#5a1f3a"/>
<rect x="132.0" y="0" width="616.0" height="1.2" fill="url(#edgec)"/>
<path d="M8 18V8H18" stroke="#ff7ab0" stroke-opacity=".7" fill="none"/><path d="M862 8H872V18" stroke="#ff7ab0" stroke-opacity=".7" fill="none"/><path d="M8 282V292H18" stroke="#ff7ab0" stroke-opacity=".7" fill="none"/><path d="M862 292H872V282" stroke="#ff7ab0" stroke-opacity=".7" fill="none"/><text x="30" y="40" class="lbl"><tspan fill="#ff3d8b">COMMIT LOG</tspan> · REAL GITHUB ACTIVITY</text><text x="440" y="150" text-anchor="middle" class="serif" font-size="26" fill="#f7e8ef">Syncing contributions<tspan fill="#ff3d8b" class="cursor">…</tspan></text><text x="440" y="182" text-anchor="middle" class="mono" font-size="10.5" fill="#c49aae">Run the “Commit log” workflow once in the Actions tab to draw this card.</text></svg>
