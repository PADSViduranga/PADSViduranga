<svg xmlns="http://www.w3.org/2000/svg" width="880" height="236" viewBox="0 0 880 236" role="img" aria-label="SonicFlow — Online music player"><title>SonicFlow — Online music player</title>
<defs>
  <linearGradient id="bgsonicflow" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#1b0712"/><stop offset=".55" stop-color="#0c0408"/><stop offset="1" stop-color="#2b0a1d"/>
  </linearGradient>
  <radialGradient id="halosonicflow" cx=".82" cy=".25" r=".7">
    <stop offset="0" stop-color="#ff3d8b" stop-opacity=".30"/><stop offset=".45" stop-color="#c2185b" stop-opacity=".10"/><stop offset="1" stop-color="#0c0408" stop-opacity="0"/>
